name: docker

# 打 tag 时推镜像到 GHCR（:0.18.0 和 :latest）；改 Dockerfile 合并到 main 时只构建 + 冒烟，
# 不推——这样 Dockerfile 坏了在发版前就能发现，而不是发完才看到镜像没了。
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR（只有打 tag 时才推）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short,prefix=dev-,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像里跑得起来，扫得出东西
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          image="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -1)"
          echo "image=${image}"
          docker run --rm "$image" --version
          docker run --rm "$image" --list-rules | tail -2
          set +e
          docker run --rm -v "$PWD:/src" -w /src "$image" --format json samples/bad > findings.json
          code=$?
          set -e
          test "$code" -eq 1
          python3 -c "import json;d=json.load(open('findings.json'));assert len(d)==22,len(d);print('findings', len(d))"