name: release

# 打 tag 就是发版：v0.3.0 会建出同名 release，并把 jar 一起传上去。
# action.yml 默认从 releases/latest/download/llm-lint.jar 取 jar，所以这个 asset 不能少。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 测试并打包
        run: mvn -B -ntp verify

      - name: tag 和 jar 里的版本得对得上
        run: |
          version="${GITHUB_REF_NAME#v}"
          actual="$(java -jar target/llm-lint.jar --version)"
          echo "tag=${GITHUB_REF_NAME} jar=${actual}"
          case "$actual" in
            *" $version") ;;
            *)
              echo "::error::tag 是 ${GITHUB_REF_NAME}，jar 报的却是 ${actual}；先把 pom.xml 的版本改成 ${version} 再打 tag"
              exit 1
              ;;
          esac

      - name: 生成本版摘要（按 commit 前缀分组）
        run: |
          python3 - <<'PY' > RELEASE_NOTES.md
          import os
          import subprocess

          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True, check=True).stdout

          # 上一个正式版本 tag（按版本号排；v1 这种指针不参与）
          older = [t for t in git("tag", "--list", "v*.*.*", "--sort=-v:refname").split() if t != tag]
          prev = older[0] if older else None
          rng = f"{prev}..{tag}" if prev else tag

          groups = [("feat", "新功能"), ("fix", "修复"), ("perf", "性能"),
                    ("docs", "文档"), ("test", "测试"), ("ci", "CI 与发版"),
                    ("refactor", "重构"), ("revert", "回滚"), ("chore", "杂项")]
          buckets = {key: [] for key, _ in groups}
          other = []

          for line in git("log", "--no-merges", "--pretty=format:%h\t%s", rng).splitlines():
              if "\t" not in line:
                  continue
              sha, subject = line.split("\t", 1)
              if ":" in subject:
                  kind = subject.split(":", 1)[0].split("(")[0].strip().lower()
                  text = subject.split(":", 1)[1].strip()
              else:
                  kind, text = "", subject
              if kind in buckets:
                  buckets[kind].append(f"- {text}（`{sha}`）")
              else:
                  other.append(f"- {subject}（`{sha}`）")

          out = ["## 本版变化", ""]
          for key, title in groups:
              if buckets[key]:
                  out.append(f"### {title}")
                  out.extend(buckets[key])
                  out.append("")
          if other:
              out.append("### 其他")
              out.extend(other)
              out.append("")
          if len(out) == 2:
              out.append("- 没有可列出的改动")
              out.append("")
          if prev:
              out.append(f"**完整对比**：https://github.com/{repo}/compare/{prev}...{tag}")
          else:
              out.append(f"**完整对比**：https://github.com/{repo}/releases/tag/{tag}")
          print("\n".join(out))
          PY
          echo "----- release 正文 -----"
          cat RELEASE_NOTES.md

      - name: 建 release，附上 jar 和本版摘要
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 失败时把 gh 的原话折成一条 ::error:: 注解：日志要权限才能下，注解不用
          fail() {
            code="$1"; shift
            msg="$(printf '%s' "$*" | tr '\n' ' ' | tail -c 900)"
            echo "::error::${msg}"
            exit "$code"
          }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # 重跑（比如 tag 被挪过）时正文也要跟着更新，不能只换 jar
            out="$(gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md 2>&1)" || fail $? "gh release edit 失败：$out"
            out="$(gh release upload "$GITHUB_REF_NAME" target/llm-lint.jar --clobber 2>&1)" || fail $? "gh release upload 失败：$out"
          else
            out="$(gh release create "$GITHUB_REF_NAME" target/llm-lint.jar --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md 2>&1)" || fail $? "gh release create 失败：$out"
            echo "$out"
          fi

      - name: v1 指针挪到这个版本
        run: |
          # 0.x 和 1.x 都指向 v1（README 里一直写 @v1）；2.0 以后别再动它，
          # 否则 @v1 的用户会被静默升到不兼容的大版本。
          major="${GITHUB_REF_NAME%%.*}"
          case "$major" in
            v0|v1) ;;
            *)
              echo "::notice::${GITHUB_REF_NAME} 的主版本是 ${major}，不动 v1 指针；要给 @v1 用户留 1.x 就手工处理"
              exit 0
              ;;
          esac
          # GitHub 的 SSH/HTTPS 入口偶尔会拒一次，推 tag 失败先退一步再试
          git tag -f v1 "$GITHUB_REF_NAME"
          for i in 1 2 3; do
            if out="$(git push -f origin "refs/tags/v1" 2>&1)"; then
              echo "v1 -> $GITHUB_REF_NAME"
              exit 0
            fi
            echo "第 $i 次推 v1 失败：$out"
            sleep $((i * 5))
          done
          echo "::error::v1 指针没挪动（三次都失败）：$(printf '%s' "$out" | tr '\n' ' ' | tail -c 500)"
          exit 1

      - name: 确认 action 默认取的那个地址真的能下到
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/llm-lint.jar"
          code="$(curl -fsSL -o /dev/null -w '%{http_code}' "$url")"
          echo "${url} -> ${code}"
          test "$code" = "200"