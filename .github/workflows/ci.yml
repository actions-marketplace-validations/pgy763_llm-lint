name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 测试（内含 samples 验收）
        run: mvn -B -ntp verify

      - name: 打包
        run: mvn -B -ntp -DskipTests package

      - name: 自检 —— samples/bad 必须被报出来
        run: |
          set +e
          java -jar target/llm-lint.jar samples/bad
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "samples/bad 应该让退出码是 1，实际是 $code"
            exit 1
          fi

      - name: 自检 —— samples/good 必须干净
        run: java -jar target/llm-lint.jar --format github samples/good

      - name: 自检 —— json 必须能被解析
        run: |
          java -jar target/llm-lint.jar --format json samples/bad > findings.json || true
          python3 - <<'PY'
          import json
          data = json.load(open("findings.json", encoding="utf-8"))
          assert len(data) == 10, f"应该 10 条，实际 {len(data)}"
          assert {d["ruleId"] for d in data} == {f"LLM{i:03d}" for i in range(1, 11)}
          print("json ok")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: llm-lint-jar
          path: target/llm-lint.jar

  action:
    name: 用自己发布的 action 扫自己
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 正例必须通过
        uses: ./
        with:
          path: samples/good

      - name: 反例必须被拦住
        id: bad
        uses: ./
        continue-on-error: true
        with:
          path: samples/bad

      - name: 确认上一步真的失败了
        if: steps.bad.outcome != 'failure'
        run: |
          echo "action 没有拦住 samples/bad（outcome=${{ steps.bad.outcome }}）"
          exit 1