name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 测试（内含 samples 验收）
        run: mvn -B -ntp verify

      - name: 打包
        run: mvn -B -ntp -DskipTests package

      - name: 自检 —— samples/bad 必须被报出来
        run: |
          set +e
          java -jar target/llm-lint.jar samples/bad
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "samples/bad 应该让退出码是 1，实际是 $code"
            exit 1
          fi

      - name: 自检 —— samples/good 必须干净
        run: java -jar target/llm-lint.jar --format github samples/good

      - name: 自检 —— sarif 必须是合法 json
        run: |
          java -jar target/llm-lint.jar --format sarif samples/bad > llm-lint.sarif || true
          python3 - <<'PY'
          import json
          d = json.load(open("llm-lint.sarif", encoding="utf-8"))
          assert d["version"] == "2.1.0"
          assert len(d["runs"][0]["results"]) == 20
          print("sarif ok")
          PY

      - name: 自检 —— json 必须能被解析
        run: |
          java -jar target/llm-lint.jar --format json samples/bad > findings.json || true
          python3 - <<'PY'
          import json
          data = json.load(open("findings.json", encoding="utf-8"))
          assert len(data) == 20, f"应该 20 条，实际 {len(data)}"
          assert {d["ruleId"] for d in data} == {f"LLM{i:03d}" for i in range(1, 21)}
          print("json ok")
          PY

      - name: 自检 —— 并行扫的结果和串行一模一样
        run: |
          java -jar target/llm-lint.jar --jobs 1 --format json samples/bad > serial.json || true
          java -jar target/llm-lint.jar --jobs 4 --format json samples/bad > parallel.json || true
          cmp serial.json parallel.json
          echo "parallel ok"

      - name: 自检 —— --since 没改动时安静退出，ref 写错时说清楚
        run: |
          set +e
          java -jar target/llm-lint.jar --since HEAD --format json samples/bad
          code=$?
          set -e
          test "$code" -eq 0
          set +e
          java -jar target/llm-lint.jar --since origin/definitely-not-a-branch samples/bad > /dev/null 2> since.err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q -- "--since" since.err

      - name: 自检 —— --lang en 说英文，规则目录能被程序读
        run: |
          java -jar target/llm-lint.jar --lang en --format json samples/bad > /dev/null 2> en.txt || true
          grep -q 'findings' en.txt
          if grep -q '个问题' en.txt; then echo "英文输出里混进了中文"; exit 1; fi
          java -jar target/llm-lint.jar --list-rules --format json > rules.json
          python3 - <<'PY'
          import json
          rules = json.load(open("rules.json", encoding="utf-8"))
          assert len(rules) == 20, f"应该 20 条规则，实际 {len(rules)}"
          assert {r["id"] for r in rules} == {f"LLM{i:03d}" for i in range(1, 21)}
          assert {r["id"] for r in rules if r["fixable"]} == {"LLM006", "LLM018"}
          assert all(r["level"] in {"off", "error", "warning", "info"} for r in rules)
          print("lang + rule catalog ok")
          PY

      - name: 自检 —— 摘要文件能给 job 页面用
        run: |
          java -jar target/llm-lint.jar --summary target/summary.md --format json samples/bad > /dev/null || true
          grep -q '20 个问题' target/summary.md
          grep -q '| LLM007 | warning | 1 |' target/summary.md
          test "$(grep -c '^| LLM' target/summary.md)" -eq 20
          echo "summary ok"

      - name: 自检 —— --fix 的补丁能真的 apply 上
        run: |
          work="$(mktemp -d)"
          mkdir -p "$work/src"
          cp samples/bad/*.java "$work/src/"
          (cd "$work" && git init -q)
          jar="$(pwd)/target/llm-lint.jar"
          (cd "$work" && java -jar "$jar" --fix --fail-on never src > fix.patch)
          test -s "$work/fix.patch"
          # 补丁里的路径得是相对的，git apply 才认
          head -1 "$work/fix.patch" | grep -q '^--- a/src/'
          (cd "$work" && git apply fix.patch)
          (cd "$work" && java -jar "$jar" --format json src > after.json) || true
          ! grep -q 'LLM006' "$work/after.json"
          ! grep -q 'LLM018' "$work/after.json"
          echo "fix ok"

      - name: 自检 —— junit / html 报告能被人和机器读，hook 能写出来
        run: |
          java -jar target/llm-lint.jar --format junit samples/bad > junit.xml || true
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          assert root.tag == "testsuites", root.tag
          cases = root.findall(".//testcase")
          assert len(cases) == 20, f"应该 20 个 testcase，实际 {len(cases)}"
          assert len(root.findall(".//failure")) == 10, "error 应该是 10 个 failure"
          print("junit ok")
          PY
          java -jar target/llm-lint.jar --format html samples/bad > report.html || true
          grep -q '<title>llm-lint</title>' report.html
          grep -q '<table>' report.html
          test "$(grep -c '<tr class=' report.html)" -eq 20
          work="$(mktemp -d)"
          git -C "$work" init -q
          java -jar target/llm-lint.jar --init-hook "$work" > /dev/null
          test -x "$work/.git/hooks/pre-commit"
          grep -q "git diff --cached" "$work/.git/hooks/pre-commit"
          if java -jar target/llm-lint.jar --init-hook "$work" 2>/dev/null; then
            echo "第二次 --init-hook 不该成功"; exit 1
          fi
          echo "reports + hook ok"

      - name: 自检 —— 仓库里的配置能替代手写参数
        run: |
          cd samples/config-demo
          set +e
          java -jar ../../target/llm-lint.jar --format json . > demo.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "config-demo 应该让退出码是 1，实际是 $code"
            exit 1
          fi
          python3 - <<'PY'
          import json
          data = json.load(open("demo.json", encoding="utf-8"))
          assert len(data) == 1, f"配置该把三条收成一条，实际 {data}"
          assert data[0]["ruleId"] == "LLM007", data
          assert data[0]["severity"] == "ERROR", "配置该把 LLM007 从 warning 提到 error"
          assert "SupportAssistant.java" in data[0]["file"], data
          print("config demo ok")
          PY

      - name: 自检 —— --init 写出来的模板自己读得回去
        run: |
          work=$(mktemp -d)
          cd "$work"
          java -jar "$GITHUB_WORKSPACE/target/llm-lint.jar" --init
          java -jar "$GITHUB_WORKSPACE/target/llm-lint.jar" --print-config | grep -q '^fail-on: error$'
          if java -jar "$GITHUB_WORKSPACE/target/llm-lint.jar" --init; then
            echo "--init 不该覆盖已经存在的配置"
            exit 1
          fi

      - name: 自检 —— 基线只放行旧问题，新犯的照样拦
        run: |
          work=$(mktemp -d)
          mkdir -p "$work/src"
          cp samples/bad/*.java "$work/src/"
          jar="$GITHUB_WORKSPACE/target/llm-lint.jar"
          # 第一次：把 20 条旧问题存进基线，这次本身不失败
          java -jar "$jar" --save-baseline "$work/base.txt" --fail-on never "$work/src" > /dev/null
          # 旧代码不动，应该干干净净
          java -jar "$jar" --baseline "$work/base.txt" --format json "$work/src" > "$work/after.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d==[], d" "$work/after.json"
          # 新写的代码又犯一次同样的错：必须只报这一条，且退出 1
          cp samples/bad/LLM010_HardcodedKey.java "$work/src/LLM010_Again.java"
          set +e
          java -jar "$jar" --baseline "$work/base.txt" --format json "$work/src" > "$work/again.json"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "基线之外的新问题应该让退出码是 1，实际是 $code"
            exit 1
          fi
          python3 - <<PY
          import json
          data = json.load(open("$work/again.json", encoding="utf-8"))
          assert len(data) == 1, f"应该只剩新犯的那一条，实际 {data}"
          assert data[0]["ruleId"] == "LLM010", data
          assert "LLM010_Again.java" in data[0]["file"], data
          print("baseline ok")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: llm-lint-jar
          path: target/llm-lint.jar

  action:
    name: 用 action 扫自己（jar 用本仓库刚构建的）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建 jar
        run: mvn -B -ntp -DskipTests package

      - name: 正例必须通过
        uses: ./
        with:
          path: samples/good
          jar: target/llm-lint.jar

      - name: 反例必须被拦住
        id: bad
        uses: ./
        continue-on-error: true
        with:
          path: samples/bad
          jar: target/llm-lint.jar

      - name: 带仓库配置的反例也必须被拦住
        id: configured
        uses: ./
        continue-on-error: true
        with:
          path: samples/config-demo
          config: samples/config-demo/.llm-lint.yml
          jar: target/llm-lint.jar

      - name: 确认反例真的失败了
        if: steps.bad.outcome != 'failure' || steps.configured.outcome != 'failure'
        env:
          BAD: ${{ steps.bad.outcome }}
          CONFIGURED: ${{ steps.configured.outcome }}
        run: |
          echo "action 没有拦住反例：samples/bad=$BAD，config-demo=$CONFIGURED"
          exit 1