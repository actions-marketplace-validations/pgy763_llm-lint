name: 报个 bug
description: 结果显示不对、命令行报错、或者直接崩了
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先确认一下：这是**误报/漏报**的话，请用「规则误报」模板，处理路径不一样。
        报之前可以跑一次 `java -jar llm-lint.jar --version`，版本号写下面。
  - type: input
    id: version
    attributes:
      label: 版本
      description: `llm-lint --version` 的输出
      placeholder: llm-lint 0.13.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统、JDK 版本；如果用 GitHub Action，写 action 版本
      placeholder: Windows 11 / JDK 21 / Action @v1
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: 你跑的命令
      render: shell
      placeholder: java -jar llm-lint.jar --format json src/main/java
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望看到什么
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际看到了什么
      description: 报错信息、退出码、或者输出片段，能贴就贴全
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 最小复现
      description: |
        一段十几行的 Java 文件就够了。如果能用 `samples/bad` 里的文件改出来更好——
        那说明我们知道该往哪看。
      render: java
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我用的是最新版本
          required: true
        - label: 我搜过 issue，没有重复
          required: true