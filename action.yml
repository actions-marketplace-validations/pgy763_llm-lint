name: 'llm-lint'
description: '扫一遍 Spring AI / LangChain4j 代码，在 commit 之前拦住那些最贵的坑'
author: 'pgy763'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  path:
    description: '要扫的目录或 .java 文件'
    required: false
    default: 'src/main/java'
  config:
    description: '仓库里的配置文件；默认从当前目录往上找 .llm-lint.yml'
    required: false
    default: ''
  fail-on:
    description: '什么级别算失败：error | warning | never；留空就用配置文件或默认的 error'
    required: false
    default: ''
  disable:
    description: '不跑的规则，逗号分隔，如 LLM004,LLM009；长期关掉建议写进 .llm-lint.yml'
  min-severity:
    description: '低于这个级别不报：info | warning | error；留空就用配置文件或默认的 info'
    required: false
    default: ''
  baseline:
    description: '存量问题清单；留空就用配置文件里的 baseline:，见 docs/baseline.md'
    required: false
    default: ''
  jobs:
    description: '同时扫几个文件；留空就按机器核数（最多 8），填 1 表示串行'
    required: false
    default: ''
  version:
    description: 'llm-lint 版本；默认 latest'
    required: false
    default: 'latest'
  jar:
    description: '已有的 llm-lint.jar 路径；填了就不再下载（给自己做自测时用）'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: 下载 llm-lint
      if: inputs.jar == ''
      shell: bash
      env:
        LLM_LINT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$LLM_LINT_VERSION" = "latest" ]; then
          url="https://github.com/pgy763/llm-lint/releases/latest/download/llm-lint.jar"
        else
          url="https://github.com/pgy763/llm-lint/releases/download/v${LLM_LINT_VERSION}/llm-lint.jar"
        fi
        curl -sSL -o "$RUNNER_TEMP/llm-lint.jar" "$url"

    - name: 扫描
      shell: bash
      env:
        LLM_LINT_PATH: ${{ inputs.path }}
        LLM_LINT_CONFIG: ${{ inputs.config }}
        LLM_LINT_FAIL_ON: ${{ inputs.fail-on }}
        LLM_LINT_DISABLE: ${{ inputs.disable }}
        LLM_LINT_MIN_SEVERITY: ${{ inputs.min-severity }}
        LLM_LINT_BASELINE: ${{ inputs.baseline }}
        LLM_LINT_JOBS: ${{ inputs.jobs }}
        LLM_LINT_JAR: ${{ inputs.jar || format('{0}/llm-lint.jar', runner.temp) }}
      run: |
        # 没填的项不传，配置文件和工具默认值才有机会说话（命令行永远最优先）。
        # 摘要写到 RUNNER_TEMP，跑完贴到 job 页面，一眼看清这次脏在哪条规则。
        args=(--format github --summary "$RUNNER_TEMP/llm-lint-summary.md")
        if [ -n "$LLM_LINT_CONFIG" ]; then
          args+=(--config "$LLM_LINT_CONFIG")
        fi
        if [ -n "$LLM_LINT_FAIL_ON" ]; then
          args+=(--fail-on "$LLM_LINT_FAIL_ON")
        fi
        if [ -n "$LLM_LINT_MIN_SEVERITY" ]; then
          args+=(--min-severity "$LLM_LINT_MIN_SEVERITY")
        fi
        if [ -n "$LLM_LINT_DISABLE" ]; then
          args+=(--disable "$LLM_LINT_DISABLE")
        fi
        if [ -n "$LLM_LINT_BASELINE" ]; then
          args+=(--baseline "$LLM_LINT_BASELINE")
        fi
        if [ -n "$LLM_LINT_JOBS" ]; then
          args+=(--jobs "$LLM_LINT_JOBS")
        fi
        args+=("$LLM_LINT_PATH")
        set +e
        java -jar "$LLM_LINT_JAR" "${args[@]}"
        code=$?
        set -e
        if [ -f "$RUNNER_TEMP/llm-lint-summary.md" ]; then
          cat "$RUNNER_TEMP/llm-lint-summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $code