name: 'llm-lint'
description: 'Static analysis for Spring AI / LangChain4j: 20 rules for model calls in transactions, shared memory, SSE timeouts.'
author: 'pgy763'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  path:
    description: 'Directory or .java file to scan'
    required: false
    default: 'src/main/java'
  config:
    description: 'Config file in the repo; defaults to discovering .llm-lint.yml upward from the workspace'
    required: false
    default: ''
  fail-on:
    description: 'What counts as failure: error | warning | never; leave empty to use the config file or the default error'
    required: false
    default: ''
  disable:
    description: 'Rules to skip, comma separated, e.g. LLM004,LLM009; prefer .llm-lint.yml for permanent switches'
  min-severity:
    description: 'Hide findings below this level: info | warning | error; leave empty to use the config file or the default info'
    required: false
    default: ''
  baseline:
    description: 'Baseline of known issues; leave empty to use baseline: from the config file (see docs/baseline.md)'
    required: false
    default: ''
  jobs:
    description: 'Files to scan in parallel; empty uses the CPU count (max 8), 1 means sequential'
    required: false
    default: ''
  since:
    description: 'Only scan files changed since this git ref, e.g. origin/main (pass the base branch in PRs; checkout needs fetch-depth: 0)'
    required: false
    default: ''
  lang:
    description: 'Language for human-readable output: zh (default) or en'
    required: false
    default: ''
  pr-comment:
    description: 'Post one sticky summary comment on pull requests (needs permissions: pull-requests: write; default true)'
    required: false
    default: 'true'
  version:
    description: 'llm-lint version; defaults to latest'
    required: false
    default: 'latest'
  jar:
    description: 'Path to an existing llm-lint.jar; when set the download step is skipped (useful for self-tests)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: 下载 llm-lint
      if: inputs.jar == ''
      shell: bash
      env:
        LLM_LINT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$LLM_LINT_VERSION" = "latest" ]; then
          url="https://github.com/pgy763/llm-lint/releases/latest/download/llm-lint.jar"
        else
          url="https://github.com/pgy763/llm-lint/releases/download/v${LLM_LINT_VERSION}/llm-lint.jar"
        fi
        curl -sSL -o "$RUNNER_TEMP/llm-lint.jar" "$url"

    - name: 扫描
      shell: bash
      env:
        LLM_LINT_PATH: ${{ inputs.path }}
        LLM_LINT_CONFIG: ${{ inputs.config }}
        LLM_LINT_FAIL_ON: ${{ inputs.fail-on }}
        LLM_LINT_DISABLE: ${{ inputs.disable }}
        LLM_LINT_MIN_SEVERITY: ${{ inputs.min-severity }}
        LLM_LINT_BASELINE: ${{ inputs.baseline }}
        LLM_LINT_JOBS: ${{ inputs.jobs }}
        LLM_LINT_SINCE: ${{ inputs.since }}
        LLM_LINT_LANG: ${{ inputs.lang }}
        LLM_LINT_JAR: ${{ inputs.jar || format('{0}/llm-lint.jar', runner.temp) }}
      run: |
        # 没填的项不传，配置文件和工具默认值才有机会说话（命令行永远最优先）。
        # 摘要写到 RUNNER_TEMP，跑完贴到 job 页面，一眼看清这次脏在哪条规则。
        args=(--format github --summary "$RUNNER_TEMP/llm-lint-summary.md"
              --markdown "$RUNNER_TEMP/llm-lint-comment.md")
        if [ -n "$LLM_LINT_CONFIG" ]; then
          args+=(--config "$LLM_LINT_CONFIG")
        fi
        if [ -n "$LLM_LINT_FAIL_ON" ]; then
          args+=(--fail-on "$LLM_LINT_FAIL_ON")
        fi
        if [ -n "$LLM_LINT_MIN_SEVERITY" ]; then
          args+=(--min-severity "$LLM_LINT_MIN_SEVERITY")
        fi
        if [ -n "$LLM_LINT_DISABLE" ]; then
          args+=(--disable "$LLM_LINT_DISABLE")
        fi
        if [ -n "$LLM_LINT_BASELINE" ]; then
          args+=(--baseline "$LLM_LINT_BASELINE")
        fi
        if [ -n "$LLM_LINT_JOBS" ]; then
          args+=(--jobs "$LLM_LINT_JOBS")
        fi
        if [ -n "$LLM_LINT_SINCE" ]; then
          args+=(--since "$LLM_LINT_SINCE")
        fi
        if [ -n "$LLM_LINT_LANG" ]; then
          args+=(--lang "$LLM_LINT_LANG")
        fi
        if [ -n "$LLM_LINT_PATH" ]; then
          args+=("$LLM_LINT_PATH")
        fi
        set +e
        java -jar "$LLM_LINT_JAR" "${args[@]}"
        code=$?
        set -e
        if [ -f "$RUNNER_TEMP/llm-lint-summary.md" ]; then
          cat "$RUNNER_TEMP/llm-lint-summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $code

    - name: 在 PR 里留一条评论
      if: always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        BODY: ${{ runner.temp }}/llm-lint-comment.md
      run: |
        if [ ! -f "$BODY" ]; then
          echo "::notice::这次没生成评论文件，跳过"
          exit 0
        fi
        if ! command -v gh >/dev/null 2>&1; then
          echo "::notice::runner 上没有 gh，跳过 PR 评论；结果看 job 摘要"
          exit 0
        fi
        # 评论开头有 <!-- llm-lint --> 标记，所以找到上次那条就地改，不会每跑一次堆一条。
        # fork 来的 PR 只有只读 token，这里会 403——那不是扫描失败，通报一声就走。
        id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
          -q '.[] | select(.body | startswith("<!-- llm-lint -->")) | .id' 2>/dev/null | head -n1 || true)"
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$BODY" >/dev/null \
            || echo "::notice::评论没更新成（fork 来的 PR 可能只读），结果看 job 摘要"
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$BODY" >/dev/null \
            || echo "::notice::评论没发成（fork 来的 PR 可能只读），结果看 job 摘要"
        fi